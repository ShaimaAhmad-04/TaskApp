<div class="container-fluid">
  <nav class="navbar navbar-expand-lg navbar-light ">
    <div class="logo">
      ToDo

    </div>
    @if(showDropdown())
    {

    <div class="dropdown ms-auto m-1">
      <div class="dropdown ms-auto m-2">
        <button type="button" class="btn btn-secondary dropdown-toggle"
          data-bs-toggle="dropdown" aria-expanded="false"
          style="background-color: #403c91;">
          <i class="bi bi-list" style="font-size: 25px;"></i>
        </button>
        <!-- dropdown menus items -->
        <ul class="dropdown-menu dropdown-menu-end">
          <li class="mb-3"><a class="dropdown-item" [routerLink]="['/profile']">
             Edit profile</a></li>

          <li class="mb-3">
            <div class="form-check form-switch dropdown-item "
              style="display: flex; justify-content: space-between;">
              <label class="form-check-label" for="flexSwitchCheckDefault">Night
                Mode</label>

              <input class="form-check-input" type="checkbox"
                id="flexSwitchCheckDefault">
            </div>
          </li>
          <li style="margin-top: 22%;"><button type="button"
              class="btn dropdown-item" (click)="signOut()">Sign Out <i
                class="bi bi-box-arrow-left"></i></button></li>
        </ul>

      </div>
    </div>
    }
  </nav>
</div>
<router-outlet></router-outlet>
