
<div class="card-container">
    <div class="card" style="width: 76rem;">
        <div class=" card-title-container title" style="    width: 98%;">
            <div class="task-card ">
                <div class="task-title ms-1" style="font-size: 2rem;">Your Tasks
                    :</div>

                <button type="button" class="btn btn-outline-light"
                    data-bs-toggle="tooltip" data-bs-placement="bottom"
                    title="Add Task">
                    <i class="bi bi-plus-circle"
                        style="font-size: 2rem;     color: #6259c7;"
                        tool></i>

                </button>
            </div>
        </div>
        @for(task of Tasks ; track task)
        {

        <div class="card" style="    width: 98%;">
            <!-- card header -->
            <div class="card-header" data-bs-toggle="modal"
                data-bs-target="#detailsModal" >
                <!-- (click)="openModal(id) -->
                <div class="task-title ms-1">
                    <h3>{{task}}</h3></div>
                <div class="btn-group" role="group"
                    aria-label="Basic mixed styles example">

                    <button type="button" class="btn"
                        style="color: rgb(30, 207, 30);"><i
                            class="bi bi-check-circle"
                            title="Done"></i> </button>

                    <button type="button" class="btn "> <i
                            class="bi bi-pen"
                            title="Edit"></i></button>

                    <button type="button" class="btn " style="color: red;"> <i
                            class="bi bi-trash"
                            title="Delete"></i></button>

                </div>

            </div>
            <!-- card body -->
            <div class="card-body">
                <span><strong>Description:</strong>
                    xxxxxxxxx</span>
            </div>
            <!-- card footer -->
            <div class="card-footer">
                <div class="due-date">Due: </div>
                <div class="priority">Priority: </div>
                <div class="status">Status: </div>
            </div>
        </div>

        }
    </div>
</div>
<!-- Details modal -->
<div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-fullscreen-md-down">
        <div class="modal-content">
            <!-- Header -->
            <div class="modal-header">
                <h5 class="modal-title">Task Details</h5>
                <button type="button" class="btn-close"
                    data-bs-dismiss="modal"></button>
            </div>

            <!-- Body -->
            <div class="modal-body">
                <p><strong>Name:</strong> </p>
                <p><strong>Description:</strong> xxxxxxxxxxxxxxxxxxxxxxxx
                xxxxxxxxxxxxxxxxxxxxxxxxxx</p>
                <div class="modal-info">
                    <p><strong>Due:</strong> </p>
                    <p><strong>Priority:</strong> </p>
                    <p><strong>Status:</strong> </p>
                </div>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                    data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
